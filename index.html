<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening BetMGM...</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; text-align: center; padding: 40px 20px; background: #1a1a2e; color: #fff; }
  .box { max-width: 400px; margin: 0 auto; background: #16213e; border-radius: 12px; padding: 30px; }
  h1 { font-size: 1.4em; margin-bottom: 10px; }
  p { color: #aaa; font-size: 0.95em; }
  .btn { display: inline-block; margin-top: 16px; padding: 14px 32px; background: #c8a951; color: #1a1a2e; border-radius: 8px; font-size: 1.1em; font-weight: 600; text-decoration: none; }
  .btn:active { background: #b89841; }
  .fallback { margin-top: 20px; display: none; }
  .fallback a { color: #c8a951; text-decoration: underline; font-size: 0.9em; }
</style>
</head>
<body>
<div class="box">
  <h1 id="title">Opening BetMGM App...</h1>
  <p id="status">Tap the button to open with your bet slip.</p>
  <a id="openBtn" class="btn" href="#">Open in App</a>
  <div class="fallback" id="fallback">
    <p>App didn't open? <a id="webLink" href="#">Open website instead</a></p>
  </div>
</div>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var rawUrl = params.get('u') || params.get('url');

  // Discord may double-encode %XX → %25XX. Decode until we see a scheme.
  var tries = 3;
  while (rawUrl && !/^[a-z]+:\/\//i.test(rawUrl) && tries-- > 0) {
    try { rawUrl = decodeURIComponent(rawUrl); } catch(e) { break; }
  }

  if (!rawUrl) {
    document.getElementById('status').textContent = 'No URL provided.';
    return;
  }

  // Determine if this is a web URL or a custom scheme URL
  var isWebUrl = /^https?:\/\//i.test(rawUrl);
  var webUrl = rawUrl;
  var appSchemeUrl = null;

  if (isWebUrl) {
    // Web URL passed — use it directly (triggers Universal Links on iOS tap)
    // Also build a betmgmsports:// fallback for auto-redirect
    var prefixes = [
      'https://www.nv.betmgm.com/en/',
      'https://sports.nv.betmgm.com/en/',
    ];
    for (var i = 0; i < prefixes.length; i++) {
      if (rawUrl.indexOf(prefixes[i]) === 0) {
        var path = rawUrl.substring(prefixes[i].length);
        if (path.indexOf('sports/events/') === 0) {
          path = path.substring('sports/'.length);
        }
        appSchemeUrl = 'betmgmsports://' + path;
        break;
      }
    }
  } else {
    // Custom scheme URL (betmgmsports://) — use directly
    appSchemeUrl = rawUrl;
    webUrl = null;
  }

  // The "Open in App" button uses the web URL (Universal Links preserve betslip)
  // Fallback to custom scheme if no web URL
  var btnUrl = webUrl || appSchemeUrl || 'betmgmsports://';
  document.getElementById('openBtn').href = btnUrl;

  // Web fallback link
  if (webUrl) {
    document.getElementById('webLink').href = webUrl;
  }

  // Try auto-redirect via custom scheme first (opens app but may lose betslip)
  if (appSchemeUrl) {
    window.location.href = appSchemeUrl;
  }

  // Show fallback after 2 seconds
  setTimeout(function() {
    document.getElementById('fallback').style.display = 'block';
  }, 2000);
})();
</script>
</body>
</html>
